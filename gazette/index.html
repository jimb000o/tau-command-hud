      <div class="c2"><p class="dc ni">Every blockchain has a rulebook. On most of them it is carved into the software itself, and changing a single line means a <i>hard fork</i>: new software, shipped to every machine, installed by every operator, with the ever-present danger that some refuse and the chain splits in two.</p>

      <div class="by">From our history desk</div>
      <div class="c2"><p class="dc ni">In August 2014 a software developer named Ohad Asor announced Zennet on the bitcointalk forum: a public, decentralised supercomputer in which anybody could rent out spare computing power and be paid for it on a blockchain.</p>
      <p>Zennet would not remain the main act. Discussing it with a forum member who signed himself <i>HunterMinerCrafter</i>, Asor heard of a much larger idea, a chain whose own rules could be changed by those who use it. He has never claimed the idea as his own.</p>
      <div class="q">“The idea for Tau is not mine. I came up with the idea for Zennet and after that I met ‘Hunter Miner Crafter’… At some point in time, he told me about the idea for Tau.”<small>Ohad Asor, interview, 2016</small></div>
      <p>In February 2015 the plan was made public as Tau-Chain, the platform, and Agoras, a market built on top of it. Zennet’s market for computing power became one kind of market in Agoras.</p>
      <p>The first explanatory film followed in August 2016. Tau, it said, is a language that comes with a blockchain, and every block holds the conditions for accepting the next one. The rules of the network, in other words, can change.</p>
      <p>Then came a pause. After a year without blog posts Asor published “The New Tau” on the last day of 2017. The goal had grown: not only a chain with changeable rules, but a way for very large groups to discuss and agree, helped by machines that understand what is said.</p>
      <div class="q">“Under certain assumptions we can reach truly efficiently scaling discussions.”<small>The New Tau, December 2017</small></div></div>
    </div>

      <h3>The Million-Person Conversation</h3>
      <p class="ni">Ask ten people to agree on a rule and you have a meeting. Ask a million and you have a riot. The Tau answer is to let every participant state what they want in a language a machine can read and reason about, so that the machine can tell who agrees with whom, where opinions contradict, and what everyone together has actually said.</p>
      <p>The same team asked, in a 2016 interview, what makes a blockchain worth having. The answer was Satoshi’s: <i>“a public shared database that everyone writes and no one can cheat”</i>. Tau set out to do the same for rules and knowledge.</p>

      <div class="box small"><p><b>WHO IS OHAD ASOR?</b> Founder of IDNI, the company behind Tau. A developer with mathematics in the background who, by his own account, went deep into logic only after he began working on Tau.</p></div>

      <h2 class="l">On Other Chains, Code Is Law. On Tau, the Agreement Is Law.</h2>
      <div class="c2"><p class="ni dc">The trouble with a rulebook made of software is that only programmers can open it, and only by sending everybody a new copy. A hard fork is a polite name for that copy. If enough people refuse it, the chain divides, and two currencies walk away from one another like brothers after a will is read.</p>
      <p>Tau keeps the rulebook inside the chain. Users write the rules in the Tau Language, a language of logic, and propose them like any other transaction. Before a proposal can apply it is compiled and checked against the rules already in force. If it contradicts them it is refused at the door and never reaches the chain.</p>
      <p>A proposal that passes the check is put to the vote. When enough votes agree, it becomes law at a block named in advance, for every node at once. There is no administrator’s key, no emergency switch kept by the founders. Nothing changes unless the vote agrees.</p>

      <div class="c2"><p class="dc ni">On the 15th of November, 2024, the Tau Language was released to the public on GitHub in an alpha edition. It is an unusual language. Most programming languages tell a computer what to do. The Tau Language describes what must be true, now and in every future step, and a solver works out how.</p>
      <p>The groundwork had been laid in the year before. In June 2023 work began on Tau’s own chain, with the stated aim that any part of the blockchain be written in logic and changeable with every new block. In November 2023 the testnet plan was set down: start minimal and let the users define what a valid block is.</p>
      <p>The team considered building on Qtum, then looked at Solana, Aptos and the Polkadot SDK during 2024, and in the end chose to build its own node. Along the way came a provisional patent on unique user identification, the release of the Tau parser, and in December 2023 a place in Nvidia’s Inception programme.</p>
      <p>In May 2024 Asor recorded eight lectures on atomless Boolean algebras, the logic underneath the language. Readers of a mathematical disposition will find them on the Tau channel. Readers of every other disposition are advised that the testnet is the friendlier introduction.</p></div>

      <p class="ni"><b>Q.</b> What does “decidable” mean, and why should I care?</p>

      <p class="ni"><b>Q.</b> And “speaks of itself”?</p>
      <p class="ni"><b>A.</b> The language can treat its own sentences as things to reason about. A rule can be about other rules, including the rule for changing rules.</p>
