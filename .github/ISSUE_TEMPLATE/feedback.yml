name: Feedback / idea
description: Tell us what you would like to see on the Tau Command HUD
labels: [feedback]
body:
  - type: dropdown
    id: category
    attributes:
      label: What is it about?
      options: [Feature idea, Chain data, Look & feel, Something broken]
    validations:
      required: true
  - type: textarea
    id: wish
    attributes:
      label: What would you like to see?
      placeholder: e.g. a timeline of governance votes, a sound when a block seals…
    validations:
      required: true
