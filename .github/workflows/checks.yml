# Runs on every pull request (and on main after a merge): the site in a headless browser, the Updates log,
# and the Python tests of the server parts. Each check says in plain words what it found; the summary of the
# run lists every page with a problem. Merge conflicts are GitHub's own check on the pull request.
name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]   # edited: a title changed to or from "[no log]"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# shell: bash runs every step with pipefail, so a check piped into tee (for the run summary) still fails the step
# when the check fails; without it the step took tee's exit code and stayed green (November 2026).
defaults:
  run:
    shell: bash

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  log:
    name: Updates log, Chinese dictionaries, scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Updates log keeps every entry of the target branch and has its Chinese text
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          git show "$BASE_REF:assets/updates.json" > "$RUNNER_TEMP/base-updates.json" 2>/dev/null || true
          if [ "${{ github.event_name }}" = "pull_request" ]; then export PR_TITLE="$TITLE"; fi
          BASE="$RUNNER_TEMP/base-updates.json" node tests/updates.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: News line headlines leave by themselves and have their zh and ja
        run: node tests/ticker.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The facts for AI assistants (llms.txt, tauhud.com/facts/) say what facts/facts.json says
        run: node tools/facts.mjs --check | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Shared scripts parse
        run: for f in assets/*.js assets/i18n/*/*.js; do node --check "$f" || exit 1; done

  pages:
    name: Every page in a browser (English and Chinese)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-chromium
      - name: Install the headless browser
        run: npm i --no-save --no-audit --no-fund playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Open every page (simulation, live node offline, Chinese, 2560 and 2000 wide)
        run: node tests/pages.mjs
        env:
          WORKERS: 3
          SETTLE_MS: 5000
      - name: White Rabbit Key's places at night (lit by their lamps, a painted night only after dark)
        run: node tests/room-night.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Summary
        if: always()
        run: cat tests/out/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Screenshots of the pages with a problem
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: page-screenshots
          path: tests/out/*.png
          if-no-files-found: ignore
          retention-days: 7

  python:
    name: Server tests (relay, alerts, bot, share, guardian)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: infra/*/requirements.txt
      - name: Install what the services use
        run: pip install -r infra/relay/requirements.txt -r infra/alerts/requirements.txt -r infra/share/requirements.txt
      - name: IDNI's tau-testnet at the commit our node runs (the Guardian is built on its approver bot)
        run: |
          REF=$(grep '^TAU_TESTNET_REF=' infra/.env.example | cut -d= -f2)
          git init -q "$RUNNER_TEMP/tau-testnet" && cd "$RUNNER_TEMP/tau-testnet"
          git fetch -q --depth 1 https://github.com/IDNI/tau-testnet.git "$REF" && git checkout -q FETCH_HEAD
          # the Python packages its code imports, at the versions that commit pins (blake3, and BLS signatures since November 2026)
          pip install $(grep -E '^(blake3|py_arkworks_bls12381)==' requirements.txt)
          echo "TAU_TESTNET_DIR=$RUNNER_TEMP/tau-testnet" >> "$GITHUB_ENV"
      - name: Run the tests
        run: tests/python.sh | tee -a "$GITHUB_STEP_SUMMARY"
