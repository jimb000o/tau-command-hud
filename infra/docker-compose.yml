# Tau HUD live backend: a tau-testnet node (read-only unless validator mode is on), a relay that serves only
# read commands from a cache, and Caddy for HTTPS.
#
# Only 80/443 (Caddy) and 4001 (P2P, so the node can sync and help the network)
# are published. The node's RPC (65432) and WebSocket (65433) stay on the
# internal Docker network; the relay is the only thing that talks to them.
services:
  tau-node:
    # node/Dockerfile: upstream Dockerfile.standalone with the broken dependency
    # prefetch removed (see the comment at its top).
    build:
      context: ./node
      args:
        TAU_TESTNET_REF: ${TAU_TESTNET_REF}
        TAU_BUILD_JOBS: ${TAU_BUILD_JOBS:-2}
    image: tau-testnet-standalone:${TAU_TESTNET_REF}
    environment:
      TAU_NETWORK_ID: tau-testnet-v2
      TAU_BOOTSTRAP_PEERS: '[{"peer_id":"12D3KooWDpWEYxBy8y84AssrPSLaq9DxC7Lncmn5wERJnAWZFnYC","addrs":["/ip4/34.251.82.246/tcp/4001"]}]'
      TAU_NETWORK_LISTEN: /ip4/0.0.0.0/tcp/4001
      # The address other nodes are told to dial us at. Without it the node
      # advertises its bind address /ip4/0.0.0.0/tcp/4001 (the IDNI bootnode's
      # bug, IDNI #82), and a peer that bootstraps from us would dial itself
      # after a restart. Override in .env when the server's address changes.
      TAU_ANNOUNCE_ADDRS: ${TAU_ANNOUNCE_ADDRS:-/ip4/2.31.101.42/tcp/4001}
      # Validator mode, off unless .env sets TAU_VALIDATOR=true (README:
      # "Validator seat"). Only proposes once the key is in the validator set.
      TAU_MINING_ENABLED: ${TAU_VALIDATOR:-false}
      # Consensus-relevant: whether governance votes from non-validators count.
      # The public network records them (block #10 of the 2026-10-27 chain
      # carries a vote from a non-validator key and its state hash includes it);
      # with the default "false" our node computes a different state hash and
      # stops verifying at that block. On 2026-11-01 IDNI switched open
      # governance off on their validator (votes from non-validators are no
      # longer admitted). Our read node stays "true": it never admits votes
      # itself, accepts every block the validator now seals, and still verifies
      # older blocks that carry non-validator votes. What visitors are told
      # comes from TAU_NETWORK_OPEN_GOVERNANCE below (relay, alerts).
      TAU_GOVERNANCE_OPEN_ADMISSION: "true"
      TAU_LOG_LEVEL: INFO
    # node/start.sh copies the genesis in and wipes chain data from another genesis.
    command: ["/usr/local/bin/tau-node-start"]
    volumes:
      - tau_data:/data
    ports:
      - "4001:4001"
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  relay:
    build: ./relay
    environment:
      UPSTREAM_URL: ws://tau-node:65433
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      TRUST_PROXY: "1"
      MAX_PER_IP: ${MAX_PER_IP:-96}   # sockets per address; every open page holds 2 to 4 (2026-10-30: 32 was hit by one visitor with many tabs)
      TAU_GOVERNANCE_OPEN_ADMISSION: ${TAU_NETWORK_OPEN_GOVERNANCE:-false}  # what the network admits now (pages, vote counting); see the node comment above
      VISITS_KEY: ${VISITS_KEY:-}   # key of the visitor numbers report; empty: made once in /data/visits.key
      SLOTLEASE_ENABLED: ${SLOTLEASE_ENABLED:-1}   # fair turns on the rule places (relay/slotlease.py); 0 switches them off
      CHAT_ENABLED: ${CHAT_ENABLED:-1}   # the troll box on the HUD (relay/chat.py); 0 closes the room
      CHAT_KEY: ${CHAT_KEY:-}   # key of the troll box admin page /chat/admin; empty: made once in /data/chat.key
      CHAT_BLOCK_WORDS: ${CHAT_BLOCK_WORDS:-}   # extra words the troll box refuses, comma separated
      CHAT_AI_KEY: ${CHAT_AI_KEY:-}   # Anthropic API key for the troll box's AI moderator (relay/chatai.py); empty: off
      CHAT_AI_MODEL: ${CHAT_AI_MODEL:-claude-haiku-5-5}
      CHAT_AI_DAILY: ${CHAT_AI_DAILY:-3000}   # at most this many AI checks per UTC day
      ROADMAP_ENABLED: ${ROADMAP_ENABLED:-1}   # comments on tauhud.com/roadmap/ (relay/roadmap.py, moderated with the troll box); 0 closes them, reading stays
      CRUISE_ENABLED: ${CRUISE_ENABLED:-1}   # cruise ships at White Rabbit Key (relay/cruise.py): simulated passengers, real test transactions; 0 keeps them away
      HACK_ENABLED: ${HACK_ENABLED:-1}   # the hack of the week replayed on the testnet, Thursdays 11:00 German time (relay/hackweek.py); 0 stops it
      NOMEMO_ENABLED: ${NOMEMO_ENABLED:-1}   # No Memo's crew purse (relay/nomemo.py): pays the chapters' shares back; 0 switches it off
      NOMEMO_TRACER: ${NOMEMO_TRACER:-1}   # the Tracer: dust from a lookalike of the drop after the first chapter; 0 keeps it quiet
      SENDER_CONNECTION: ${SENDER_CONNECTION:-1}   # island bot + cruise ships send through their own node connection (relay.py Relay.sender); 0 = share the visitors one as before
    volumes:
      # chain restarts and dropped transactions for /stats (relay.py EVENTS_PATH),
      # availability history for /uptime (UPTIME_PATH)
      - relay_data:/data
      - ai_usage:/ai-usage   # what the troll box's AI check costs (ai_meter.py), read by the monthly costs post
    depends_on: [tau-node]
    restart: unless-stopped
    logging: *logging

  # Rule Playground checker (checker/checker.py): runs a visitor's rule through
  # tau-testnet's own screens and its isolated engine worker. Same image as the
  # node, so nothing is compiled for it; no chain data, no node access, no
  # outbound network, capped in memory, CPU and processes.
  checker:
    image: tau-testnet-standalone:${TAU_TESTNET_REF}
    pull_policy: never   # built locally by the tau-node service
    command: ["python", "-I", "/checker/checker.py"]
    working_dir: /app/tau-testnet
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ENGINE_LABEL: tau-lang c3ea334 · tau-testnet ${TAU_TESTNET_REF}
      TAU_ENV: test
      TAU_SHRINK_ENABLED: "false"
      TAU_DB_PATH: /tmp/checker.db
      TAU_DATA_DIR: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      INTEL_SECRET: ${INTEL_SECRET:-}   # No Memo's intel contracts deal their hidden rules from it (checker/intel.py); `up tau` makes one
    volumes:
      - ./checker:/checker:ro
      # the lesson examples, so `up tau` can check every one of them against this engine
      - ../learn/lessons.json:/learn/lessons.json:ro
    read_only: true
    tmpfs: [/tmp]
    # Root inside the container only because the engine's libraries live under
    # /root/.tau in the node image; it holds no capabilities and cannot gain any.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m        # one engine worker measured at ~60 MB
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 64
    networks: [checker]
    restart: unless-stopped
    logging: *logging

  # Proposal tracker and alerts (alerts/alerts.py): reads the chain from the
  # relay like any visitor, replays governance, writes proposals.json and
  # feed.xml for Caddy, and posts news to Telegram / X when .env holds their
  # keys (each channel is off without them).
  alerts:
    build: ./alerts
    environment:
      RELAY_URL: ws://relay:8080
      TAU_GOVERNANCE_OPEN_ADMISSION: ${TAU_NETWORK_OPEN_GOVERNANCE:-false}  # what the network admits now (pages, vote counting); see the node comment above
      FEED_URL: https://${RELAY_DOMAIN}/feed.xml
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-@tauHUDcom}
      X_API_KEY: ${X_API_KEY:-}
      X_API_SECRET: ${X_API_SECRET:-}
      X_ACCESS_TOKEN: ${X_ACCESS_TOKEN:-}
      X_ACCESS_SECRET: ${X_ACCESS_SECRET:-}
      X_PROFILE_URL: ${X_PROFILE_URL:-}
      # Agorzilla's own X keys: only read here by the channel check (alerts.py --check); the agorzilla service posts with them
      AGORZILLA_X_API_KEY: ${AGORZILLA_X_API_KEY:-}
      AGORZILLA_X_API_SECRET: ${AGORZILLA_X_API_SECRET:-}
      AGORZILLA_X_ACCESS_TOKEN: ${AGORZILLA_X_ACCESS_TOKEN:-}
      AGORZILLA_X_ACCESS_SECRET: ${AGORZILLA_X_ACCESS_SECRET:-}
      # X is paid per post ($0.015, $0.20 with a link): short texts without links, at most this many a day and a month
      # (2 a day since 12 Nov 2026: only the day's best; several automatic posts a day read as a bot)
      X_RESERVE: ${X_RESERVE:-1}
      X_DAILY_CAP: ${X_DAILY_CAP:-2}
      X_MONTHLY_CAP: ${X_MONTHLY_CAP:-240}
      X_LINKS: ${X_LINKS:-false}
      POST_GAP_MINUTES: ${POST_GAP_MINUTES:-120}   # an X copy within this many minutes of the last post is left out (chain news never)
      SIM_POSTS: ${SIM_POSTS:-false}   # the simulation's switches and visitor rule changes as posts (off since 5 Nov 2026)
      X_SIM: ${X_SIM:-false}   # the simulation is not news for X (12 Nov 2026)
      # the crew's ship log (alerts/crewlog.py): a members-only post in the Tau HUD crew every Monday after the recap;
      # the shop's API user from Fourthwall (Settings, For developers, Open API), off until CREWLOG_ENABLED=true (up crewlog on)
      FOURTHWALL_API_USER: ${FOURTHWALL_API_USER:-}
      FOURTHWALL_API_PASS: ${FOURTHWALL_API_PASS:-}
      CREWLOG_ENABLED: ${CREWLOG_ENABLED:-false}
      X_PICTURES: ${X_PICTURES:-true}   # the rule change's card, the live overview or a new page's picture under the post
      # weekly recap image and newspaper (alerts/recap.py, gazette.py): Monday 09:00 German time unless .env says otherwise
      RECAP_ENABLED: ${RECAP_ENABLED:-true}
      RECAP_WEEKDAY: ${RECAP_WEEKDAY:-0}
      RECAP_HOUR: ${RECAP_HOUR:-9}
      RECAP_TZ: ${RECAP_TZ:-Europe/Berlin}
      RECAP_LATE_HOURS: ${RECAP_LATE_HOURS:-3}   # a Monday post missed by longer (a restart) is skipped, never posted in a burst
      # changes to Tau HUD itself, from assets/updates.json, at fixed times (UTC): everything new since the last one in one post
      SITE_UPDATES: ${SITE_UPDATES:-true}
      SITE_SLOTS: ${SITE_SLOTS:-8,12,16}
      # the smaller site changes once a week (Friday 16 UTC = 17:00 German winter time), 5 by name, Telegram only
      SITE_DIGEST_WEEKDAY: ${SITE_DIGEST_WEEKDAY:-4}
      SITE_DIGEST_HOUR: ${SITE_DIGEST_HOUR:-16}
      SITE_DIGEST_LINES: ${SITE_DIGEST_LINES:-5}
      SITE_DIGEST_X: ${SITE_DIGEST_X:-false}
      # "Testnet today": the real chain's day in one evening post; practice votes are counted there, not posted one by one
      TESTNET_TODAY: ${TESTNET_TODAY:-true}
      TESTNET_TODAY_HOUR: ${TESTNET_TODAY_HOUR:-19}
      # a closer look at one page a day (assets/deepdives.json, read from the site) and the Key Crier's island morning (relay /isle)
      DEEPDIVES: ${DEEPDIVES:-true}
      DEEPDIVE_HOUR: ${DEEPDIVE_HOUR:-13}
      DEEPDIVE_X_EVERY: ${DEEPDIVE_X_EVERY:-2}
      DEEPDIVE_DAYS: ${DEEPDIVE_DAYS:-0,2,4}   # Monday, Wednesday, Friday
      IDNI_DIGEST: ${IDNI_DIGEST:-true}   # IDNI's progress of the day as one post (devpulse writes it, here it goes out; up idni)
      IDNI_DIGEST_LATE_HOURS: ${IDNI_DIGEST_LATE_HOURS:-3}
      ISLAND_CRIER: ${ISLAND_CRIER:-true}
      ISLAND_HOUR: ${ISLAND_HOUR:-7}
      ISLAND_X_EVERY_DAYS: ${ISLAND_X_EVERY_DAYS:-1}
      # the news line's watchtower (alerts/tickerwatch.py): a stale HUD news line is told to the owner only, privately
      # (up owner sets that chat; TICKER_OWNER_CHAT sets a chat id directly), never to the channel
      TICKER_WATCH: ${TICKER_WATCH:-true}
      TICKER_OWNER_CHAT: ${TICKER_OWNER_CHAT:-}
      TICKER_STALE_DAYS: ${TICKER_STALE_DAYS:-7}
    volumes:
      - alerts_state:/state     # what was seen and posted, so nothing is posted twice
      - alerts_public:/public   # proposals.json, feed.xml and recap/, served by Caddy
      - ai_usage:/ai-usage      # the Anthropic API's costs per month (ai_meter.py), for the costs post
      - /opt/sites/rico/art:/art:ro   # the island painting the game shows: the Key Crier's X picture (island_pic.py)
    depends_on: [relay]
    restart: unless-stopped
    logging: *logging

  # Donation thank-yous (alerts/donations.py): watches the donation address on
  # Ethereum (AGRS and ETH only) through the public Blockscout API, keeps
  # donations.json for the About section and posts one thank-you per new
  # donation to the channel. Same image as alerts, its own state file.
  donations:
    build: ./alerts
    command: ["python", "donations.py"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-@tauHUDcom}
      X_API_KEY: ${X_API_KEY:-}
      X_API_SECRET: ${X_API_SECRET:-}
      X_ACCESS_TOKEN: ${X_ACCESS_TOKEN:-}
      X_ACCESS_SECRET: ${X_ACCESS_SECRET:-}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      DONATION_IGNORE_FROM: ${DONATION_IGNORE_FROM:-}  # own wallets, comma separated: transfers from them are not donations
    volumes:
      - alerts_state:/state
      - alerts_public:/public
    restart: unless-stopped
    logging: *logging

  # What the site's tools were paid (alerts/receipts.py): reads the receipts of Google AI Studio, ElevenLabs, Kling, the
  # X API and the Anthropic API from the mailbox in .env (read-only, every 30 min) and keeps costs-paid.json for
  # tauhud.com/donate/ (tool, amount, day; nothing else of a mail). `up cost` starts it, `up cost mail` sets the mailbox,
  # `up cost gemini 10` adds a payment by hand.
  costs:
    build: ./alerts
    command: ["python", "receipts.py", "loop"]
    init: true
    environment:
      COSTS_IMAP_HOST: ${COSTS_IMAP_HOST:-imap.gmail.com}
      COSTS_IMAP_USER: ${COSTS_IMAP_USER:-}
      COSTS_IMAP_PASSWORD: ${COSTS_IMAP_PASSWORD:-}
    volumes:
      - alerts_state:/state
      - alerts_public:/public
    restart: unless-stopped
    logging: *logging

  # The blog (alerts/blog.py): after each cruise ship visit, a language model writes one learnings article from the
  # facts counted out of the ship's public logbook (en, zh, ja), as an unlisted draft. Nothing goes on
  # tauhud.com/blog/ or to the channels until `up blog publish <id>`; `up blog` lists the drafts waiting.
  blog:
    build: ./alerts
    command: ["python", "blog.py", "loop"]
    init: true
    environment:
      RELAY_HTTP: http://relay:8080
      NEWS_AI_KEY: ${NEWS_AI_KEY:-}
      CHAT_AI_KEY: ${CHAT_AI_KEY:-}
      NEWS_AI_MODEL: ${NEWS_AI_MODEL:-claude-sonnet-5-5}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-@tauHUDcom}
      X_API_KEY: ${X_API_KEY:-}
      X_API_SECRET: ${X_API_SECRET:-}
      X_ACCESS_TOKEN: ${X_ACCESS_TOKEN:-}
      X_ACCESS_SECRET: ${X_ACCESS_SECRET:-}
      # the cruise ships by themselves (alerts/cruise_crier.py): each call announced on Telegram and X this many minutes
      # before it (150: Wednesday 13:30, Saturday 11:30 German time), each visit's numbers to the owner's private chat
      # after it; CRUISE_CRIER=false stops both (CRUISE_ENABLED=0 keeps the ships themselves away)
      CRUISE_CRIER: ${CRUISE_CRIER:-true}
      CRUISE_ANNOUNCE_MINUTES: ${CRUISE_ANNOUNCE_MINUTES:-150}
      # after each Tuesday call of the pirates, a ~22 s clip of every trick the chain refused, to Telegram and X (alerts/
      # trick_clip.py; none when a trick got through); X only while the day's X posts leave room. false stops it
      TRICK_CLIP: ${TRICK_CLIP:-true}
      X_BLOG_LINK: ${X_BLOG_LINK:-true}   # the article's X post with its link ($0.20 instead of $0.015)
      X_DAILY_CAP: ${X_DAILY_CAP:-2}
      TICKER_OWNER_CHAT: ${TICKER_OWNER_CHAT:-}
      # a clean blog draft on the blog by itself this many hours after it was written (24 since 6.11.2026); 0 = only by hand (up blog publish)
      BLOG_AUTO_PUBLISH_HOURS: ${BLOG_AUTO_PUBLISH_HOURS:-24}
      # the article's post on Telegram and X only up to this many hours after its call began; later it goes on the blog
      # without a post (0 = no limit; up blog publish <id> --post posts a late one by hand)
      BLOG_POST_MAX_HOURS: ${BLOG_POST_MAX_HOURS:-30}
      # room between two posts on Telegram or X (minutes): the article, the pirates' clip and the hack post wait for it
      POST_GAP_MINUTES: ${POST_GAP_MINUTES:-120}
      # the weekly report for IDNI (alerts/idni_report.py): counted from our public data, written as an unlisted page with
      # a pre-filled issue link for IDNI/tau-testnet and told to the owner's private chat (Sunday 18:00 German time);
      # never filed by itself. IDNI_REPORT=false stops it; up report shows it any time
      IDNI_REPORT: ${IDNI_REPORT:-true}
      IDNI_REPORT_WEEKDAY: ${IDNI_REPORT_WEEKDAY:-6}
      IDNI_REPORT_HOUR: ${IDNI_REPORT_HOUR:-18}
      # Kling, the AI video maker (alerts/kling.py): the island painting alive on /rabbit/, a trailer for a new island, the
      # cruise announcements as videos, the pirates' clip on a living sea, Agorzilla's growth as a video. KLING_API_KEY
      # (or KLING_ACCESS_KEY + KLING_SECRET_KEY) in .env; without one every post goes out with its still picture as before.
      # KLING_MONTH_CAP clips a month for all uses together; the first KLING_REVIEW clips of each public use are drafts
      KLING_API_KEY: ${KLING_API_KEY:-}
      KLING_ACCESS_KEY: ${KLING_ACCESS_KEY:-}
      KLING_SECRET_KEY: ${KLING_SECRET_KEY:-}
      KLING_API_BASE: ${KLING_API_BASE:-}
      KLING_MODEL: ${KLING_MODEL:-}
      KLING_MONTH_CAP: ${KLING_MONTH_CAP:-30}
      KLING_REVIEW: ${KLING_REVIEW:-2}
      KLING_USES: ${KLING_USES:-island,trailer,ship,pirate,agorzilla}
      KLING: ${KLING:-true}
      KLING_WHO: blog
    volumes:
      - alerts_state:/state     # /state/blog.json: which visits have a draft, which drafts were posted
      - alerts_public:/public   # /public/blog/posts.json and drafts/, served by Caddy
      - ai_usage:/ai-usage      # what each draft cost (ai_meter.py)
      - /opt/sites/rico/art:/art:ro         # the island's paintings: each article's hero picture is made from them
      - ../rabbit/art/ships:/ships:ro       # the painted ships on that picture
    depends_on: [relay]
    mem_limit: 384m        # the pirates' clip: Pillow frames into ffmpeg (two threads, 720p) for about a minute a week
    restart: unless-stopped
    logging: *logging

  # Our node's own log for the weekly IDNI report (alerts/node_logs.py): IDNI asked for sync and peering failures with
  # their logs (Q&A, November 2026). Docker keeps container logs readable by root only, so this one small service runs
  # as root, with that folder read-only and no network, and once an hour writes the node's sync and peering warnings of
  # the last days, addresses masked, to /state/node-log.json; the blog service (not root) reads only that file.
  nodelog:
    build: ./alerts
    command: ["python", "node_logs.py", "loop"]
    init: true
    user: root
    network_mode: none
    environment:
      NODE_LOG_DIR: /dockerlogs
      NODE_LOG_SERVICE: tau-node
      NODE_LOG_STATE: /state/node-log.json
    volumes:
      - /var/lib/docker/containers:/dockerlogs:ro
      - alerts_state:/state
    mem_limit: 128m
    restart: unless-stopped
    logging: *logging

  # Build pulse (alerts/devpulse.py): keeps blob-less clones of IDNI's public
  # repositories and writes devpulse.json for tauhud.com/devpulse/ every 30
  # minutes: newest commits, weekly rhythm, code areas, tags, how far upstream
  # is ahead of the commits our node is built from (read from node/Dockerfile),
  # IDNI's news for the HUD's news line, and whether our node patches still
  # apply to the newest tau-testnet main (`up` prints it as "idni:"), and which
  # IDNI commits and branches name our issues (moves the Road to mainnet badges). After each pass it writes Tau today
  # for AI assistants (knowledge.py): node.tauhud.com/tau-today.md and .json, read by tauhud.com/facts/ and llms.txt.
  devpulse:
    build: ./alerts
    command: ["python", "devpulse.py"]
    init: true   # git leaves helper processes behind; PID 1 python never reaped them (150 zombies on 6.11.2026), tini does
    environment:
      RELAY_HTTP: http://relay:8080
      TAU_TESTNET_REF: ${TAU_TESTNET_REF}
      # IDNI news headlines: a language model reads each new merge once and writes what it means (en, zh, ja).
      # NEWS_AI_KEY (an Anthropic API key) falls back to the troll box's CHAT_AI_KEY; without either, no IDNI news.
      NEWS_AI_KEY: ${NEWS_AI_KEY:-}
      CHAT_AI_KEY: ${CHAT_AI_KEY:-}
      NEWS_AI_MODEL: ${NEWS_AI_MODEL:-claude-sonnet-5-5}
      # once a day at this hour (UTC) everything IDNI merged since the last one is written up as ONE post (idni_digest.py)
      IDNI_DIGEST_HOUR: ${IDNI_DIGEST_HOUR:-10}
      IDNI_DIGEST_LATE_HOURS: ${IDNI_DIGEST_LATE_HOURS:-3}
      IDNI_DIGEST_LANG_ALONE: ${IDNI_DIGEST_LANG_ALONE:-false}   # true: a day with only tau-lang changes gets a post too
      # roadmap_watch.py: when an IDNI issue or pull request that tauhud.com/roadmap/ links changes state, one private
      # note to the owner (the chat `up owner` set, in /state/owner.json), never the channel
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TICKER_OWNER_CHAT: ${TICKER_OWNER_CHAT:-}
    volumes:
      - alerts_state:/state     # the clones, in /state/devpulse; digests.json (the daily IDNI post)
      - alerts_public:/public   # devpulse.json, served by Caddy
      - ai_usage:/ai-usage      # what the news line and the daily IDNI post cost (ai_meter.py)
      - ./node/Dockerfile:/pins/Dockerfile:ro
      - ./node/patches:/pins/patches:ro   # tried on each new upstream main: do our node patches still apply?
      - ../facts:/facts:ro   # the hand-checked facts for Tau today (knowledge.py, tauhud.com/facts/); a folder, so a pull reaches it
      - ../roadmap:/roadmap:ro   # the Road to mainnet page: which IDNI issues and pull requests it links (roadmap_watch.py)
    depends_on: [relay]
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

  # Agorzilla's evening (alerts/agorzilla.py): reads agorzilla.com/chain/latest.json
  # every 10 minutes and posts each newly closed evening once to the Telegram
  # channel and, with its own keys, to Agorzilla's X account (plus growth stages
  # there). AGORZILLA_POSTS=0 turns it off.
  agorzilla:
    build: ./alerts
    command: ["python", "agorzilla.py"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-@tauHUDcom}
      AGORZILLA_POSTS: ${AGORZILLA_POSTS:-1}
      AGORZILLA_X_API_KEY: ${AGORZILLA_X_API_KEY:-}
      AGORZILLA_X_API_SECRET: ${AGORZILLA_X_API_SECRET:-}
      AGORZILLA_X_ACCESS_TOKEN: ${AGORZILLA_X_ACCESS_TOKEN:-}
      AGORZILLA_X_ACCESS_SECRET: ${AGORZILLA_X_ACCESS_SECRET:-}
      AGORZILLA_X_DAILY_CAP: ${AGORZILLA_X_DAILY_CAP:-2}
      # Kling, the AI video maker (alerts/kling.py): the island painting alive on /rabbit/, a trailer for a new island, the
      # cruise announcements as videos, the pirates' clip on a living sea, Agorzilla's growth as a video. KLING_API_KEY
      # (or KLING_ACCESS_KEY + KLING_SECRET_KEY) in .env; without one every post goes out with its still picture as before.
      # KLING_MONTH_CAP clips a month for all uses together; the first KLING_REVIEW clips of each public use are drafts
      KLING_API_KEY: ${KLING_API_KEY:-}
      KLING_ACCESS_KEY: ${KLING_ACCESS_KEY:-}
      KLING_SECRET_KEY: ${KLING_SECRET_KEY:-}
      KLING_API_BASE: ${KLING_API_BASE:-}
      KLING_MODEL: ${KLING_MODEL:-}
      KLING_MONTH_CAP: ${KLING_MONTH_CAP:-30}
      KLING_REVIEW: ${KLING_REVIEW:-2}
      KLING_USES: ${KLING_USES:-island,trailer,ship,pirate,agorzilla}
      KLING: ${KLING:-true}
      KLING_WHO: agorzilla
      TICKER_OWNER_CHAT: ${TICKER_OWNER_CHAT:-}
    volumes:
      - alerts_state:/state     # remembers the last evening posted, /state/agorzilla.json
      - agorzilla_shots:/shots:ro   # the evening's before/after photographs (agorzilla-shots below)
      - alerts_public:/public   # /public/kling/drafts/: a growth clip to look at (kling.py)
    mem_limit: 256m        # a growth clip through ffmpeg, a few times a month
    restart: unless-stopped
    logging: *logging

  # Agorzilla's archive and summary (agorzilla.com/chain/archive.json, archive.js, latest.json;
  # latest.json is read by Tau HUD's header and the evening post): the agorilla repo's
  # tools/archive.cjs --live, every 10 minutes, from the site's own checkout. GitHub's 30-minute
  # schedule often skips runs, and a testnet restart between two of them would lose meals, so a
  # complete archive is kept here; the repo's Action keeps the public copy. Caddy
  # (sites/agorzilla.caddy) serves these files first and falls back to the checkout's copies.
  # A checkout from before --live existed makes only latest.json (--latest). Each run is cut off
  # after 5 minutes, so a hanging connection never stops the loop.
  agorzilla-latest:
    image: node:22-alpine
    command: ["sh", "-c", "while true; do if grep -q -- '--live' /repo/tools/archive.cjs; then timeout 300 node /repo/tools/archive.cjs --live; else timeout 300 node /repo/tools/archive.cjs --latest; fi || echo 'archive run failed, next in 10 min'; sleep 600; done"]
    environment:
      AGORILLA_NODE: ws://relay:8080
      AGORILLA_OUT: /out/chain
    volumes:
      - /opt/sites/agorilla:/repo:ro
      - /opt/sites/agorilla-live:/out
    depends_on: [relay]
    mem_limit: 128m
    restart: unless-stopped
    logging: *logging

  # Agorzilla's evening pictures (agorzilla-shots/shots.mjs): after each evening a headless
  # Chromium opens agorzilla.com like a visitor and photographs the creature just before and
  # just after it; the evening post above sets the two side by side, agorzilla.com shows them
  # under /evenings/ (sites/agorzilla.caddy). Reads latest.json every 2 minutes, works a minute
  # or so once a day.
  # Tau HUD's own pages for the posts (agorzilla-shots/site-shots.mjs, the same Chromium image): every 6 hours the
  # front page, /status/ and each page a post may show, in Live mode after the live data arrived, each picture checked
  # (green header, no "–", no simulation data) before it is kept in alerts_public/pageshots/ (node.tauhud.com/pageshots/).
  # The posts take only these checked pictures (alerts.py live_shot); `up shots` runs one round at once.
  site-shots:
    build: ./agorzilla-shots
    command: ["node", "site-shots.mjs"]
    environment:
      PAGESHOTS_DIR: /out/pageshots
    volumes:
      - alerts_public:/out
    shm_size: 256m
    mem_limit: 768m
    restart: unless-stopped
    logging: *logging

  agorzilla-shots:
    build: ./agorzilla-shots
    volumes:
      - agorzilla_shots:/shots
    shm_size: 256m
    mem_limit: 768m
    restart: unless-stopped
    logging: *logging

  # Question bot (alerts/bot.py): the same Telegram bot answers people who
  # write to it (/height, /proposals, /tx, /address, /block, /status) with data
  # from the relay and proposals.json. Long polling, so no inbound port; it
  # never posts into the alerts channel. Off without TELEGRAM_BOT_TOKEN.
  bot:
    build: ./alerts
    command: ["python", "bot.py"]
    environment:
      RELAY_URL: ws://relay:8080
      RELAY_HTTP: http://relay:8080
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-@tauHUDcom}
    volumes:
      - alerts_public:/public:ro   # proposals.json, written by alerts
      - alerts_state:/state        # follows.json: personal alerts, only chat ids and what each follows (alerts/follow.py); owner.json (up owner)
    depends_on: [relay, alerts]
    mem_limit: 128m
    restart: unless-stopped
    logging: *logging

  # Share previews (share/share.py): the pictures X, Telegram and WhatsApp show
  # under a link (/og/…png) and small link pages that carry them (/s/…). Reads
  # the chain from the relay like any visitor and proposals.json from alerts.
  share:
    build:
      context: .
      dockerfile: share/Dockerfile
    environment:
      RELAY_URL: ws://relay:8080
      RELAY_HTTP: http://relay:8080
      PUBLIC_URL: https://${RELAY_DOMAIN}
    volumes:
      - alerts_public:/public:ro
      # Agorzilla's feeder card (/og/agorzilla/<wallet>.png): feeders.json from agorzilla-latest,
      # the newest evening photograph from agorzilla-shots, the painting from the site's checkout
      - /opt/sites/agorilla-live:/agz:ro
      - agorzilla_shots:/shots:ro
      - /opt/sites/agorilla:/agzrepo:ro
    depends_on: [relay]
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

  # Guardian (guardian/guardian.py, tauhud.com/guardian/): a second factor for a testnet account. The account's own rule
  # says "above N the Guardian co-signs"; the owner types the code from an authenticator app on the page, this service
  # checks it and co-signs (a feeless transfer_vote). It can only say yes to a payment the account asked for, never
  # send one, and holds nobody's key. Built on IDNI's reference approver bot (tau-testnet scripts/approval_bot_totp.py),
  # so it runs in the node image, which carries that code; the code here is mounted, so `up guardian` needs no build
  # and leaves the node alone. Its own key and the authenticator secrets stay in the guardian_data volume.
  guardian:
    image: tau-testnet-standalone:${TAU_TESTNET_REF}
    pull_policy: never   # built locally by the tau-node service
    command: ["python", "-u", "/guardian/guardian.py", "serve"]
    working_dir: /app/tau-testnet
    environment:
      GUARDIAN_ENABLED: ${GUARDIAN_ENABLED:-1}   # 0: the page says the Guardian is off; payments above a limit then wait
      GUARDIAN_MAX_ACCOUNTS: ${GUARDIAN_MAX_ACCOUNTS:-50}
      NODE_HOST: tau-node
      NODE_PORT: "65432"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./guardian:/guardian:ro
      - guardian_data:/data
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 192m
    pids_limit: 64
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2.8.4
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - alerts_public:/srv/alerts:ro
      - /opt/sites:/srv/sites:ro
      - agorzilla_shots:/srv/agorzilla-shots:ro
    networks: [default, checker]
    depends_on: [relay, checker, share]
    restart: unless-stopped
    logging: *logging

networks:
  default:
  # Internal: the checker can talk to Caddy and nothing else.
  checker:
    internal: true

volumes:
  tau_data:
  relay_data:
  alerts_state:
  alerts_public:
  ai_usage:
  agorzilla_shots:
  guardian_data:
  caddy_data:
  caddy_config:
