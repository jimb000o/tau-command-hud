<style>
/* The site around the game keeps the HUD tokens; the island itself is its own warm, tropical world. */
:root {
  --void: #09090a; --line: rgba(255,255,255,.09); --hair: rgba(255,255,255,.18);
  --ok: #39ff8a; --dim: #8a8a94; --text: #ebebee; --amber: #ffb13b; --bad: #ff4d6d;
  --display: "Sora", "Manrope", "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --glass: rgba(10,14,18,.82);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--void); color: var(--text); font: 13px/1.5 var(--mono); overflow: hidden; }
a { color: #fff; }
.wrap { height: 100%; display: flex; flex-direction: column; gap: 8px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.wrap > *, .wrap > .tnav { flex: none; }
header { display: flex; align-items: center; justify-content: space-between; gap: 10px 20px; padding: 2px 0; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; }
.mark { width: 28px; height: 28px; fill: none; stroke: #fff; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.mark .pulse { stroke: var(--ok); }
.brand h1 { margin: 0; font: 700 16px var(--display); letter-spacing: .02em; }
.brand span { color: var(--dim); font: 12px var(--mono); }

/* the stage: the island fills it, the game's panels float over it */
.stage { position: relative; flex: 1 1 auto; min-height: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #0b2a3a; isolation: isolate; }
.stage:fullscreen { border-radius: 0; border: 0; }
#cvScene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
.bar { position: absolute; z-index: 3; left: 12px; right: 12px; top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
.bar > * { pointer-events: auto; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 4px 12px; border-radius: 999px; background: var(--glass); border: 1px solid var(--hair); color: var(--text); font: 600 12.5px var(--display); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.chip.me { padding-left: 4px; }
.chip.me .face { border-radius: 50%; background: rgba(255,255,255,.08); }
#cvMoves { display: inline-flex; gap: 5px; }
#cvMoves i { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--hair); }
#cvMoves i.on { background: var(--ok); border-color: var(--ok); box-shadow: 0 0 8px rgba(57,255,138,.6); }
.bar .sp { flex: 1; }
button.chip { cursor: pointer; }
button.chip:hover { border-color: #fff; }
.news { position: absolute; z-index: 3; left: 12px; right: 12px; bottom: 10px; display: flex; gap: 10px; align-items: center; min-height: 34px; padding: 6px 14px; border-radius: 10px; background: var(--glass); border: 1px solid var(--hair); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.news b { font: 700 11px var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--ok); white-space: nowrap; }
.news span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
/* the radio at the bottom: Rico at the microphone, his line typed out as he says it */
.news.radio { padding-left: 6px; min-height: 46px; }
.news.radio #cvDJ { flex: none; width: 40px; height: 40px; margin: -10px 0 -4px; }
.news.radio #cvDJ canvas { width: 40px; height: 40px; display: block; }
.news.radio b { display: inline-flex; align-items: center; gap: 6px; color: var(--ok); }
.cv-tx { color: var(--ok); text-decoration: none; font-size: 11px; }
.news.radio .onair { width: 7px; height: 7px; border-radius: 50%; background: #e9b44c; box-shadow: 0 0 6px #e9b44c; }
.news.radio.live .onair { animation: cvAir 1s steps(2) infinite; }
@keyframes cvAir { 50% { opacity: .25; } }
.news.radio.live #cvNews { color: #fbf3df; }
.news.radio #cvNews { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.35; }
#cvTip { position: absolute; z-index: 4; pointer-events: none; padding: 5px 10px; border-radius: 6px; background: #050506; border: 1px solid var(--hair); font: 600 12.5px var(--display); color: #fff; white-space: nowrap; }
#cvToast { position: absolute; z-index: 6; left: 50%; top: 58px; transform: translate(-50%, -8px); opacity: 0; transition: .3s; padding: 8px 16px; border-radius: 999px; background: #050506; border: 1px solid var(--ok); color: #fff; font: 600 13px var(--display); pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
#cvToast.on { opacity: 1; transform: translate(-50%, 0); }
.places { position: absolute; z-index: 2; left: 12px; bottom: 54px; display: flex; flex-wrap: wrap; gap: 6px; opacity: 0; pointer-events: none; }
.places:focus-within { opacity: 1; pointer-events: auto; }
.places button { min-height: 34px; padding: 4px 10px; border-radius: 8px; background: var(--glass); color: #fff; border: 1px solid var(--hair); font: 600 12px var(--display); cursor: pointer; }

/* a card: someone speaks, you choose */
.cv-card { position: absolute; z-index: 5; right: 16px; top: 56px; bottom: auto; max-height: calc(100% - 118px); width: min(470px, 42%); display: flex; flex-direction: column; gap: 10px; padding: 18px 18px 16px; border-radius: 14px; background: var(--glass); border: 1px solid var(--hair); box-shadow: 0 30px 80px -30px rgba(0,0,0,.9); overflow: auto; overscroll-behavior: contain; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); animation: pop .3s cubic-bezier(.2,.8,.2,1); scrollbar-width: thin; }
.cv-card.left { right: auto; left: 16px; }
/* a conversation: one plate at the bottom middle, above the radio strip, the person standing large behind it */
.cv-card.talk { left: 50%; right: auto; top: auto; bottom: 58px; transform: translateX(-50%); width: min(860px, calc(100% - 32px)); max-height: min(46%, calc(100% - 118px)); border-radius: 6px; background: rgba(20,14,9,.9); border: 3px double rgba(232,206,150,.55); outline: 1px solid rgba(232,206,150,.14); outline-offset: 4px; animation: popc .35s cubic-bezier(.2,.8,.2,1); }
.cv-card.talk .cv-acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.cv-card.talk .cv-b { border-color: rgba(232,206,150,.28); background: rgba(232,206,150,.04); }
.cv-card.talk .cv-b:hover:not([disabled]), .cv-card.talk .cv-b:focus-visible { border-color: #f3dfb4; background: rgba(232,206,150,.1); }
.cv-card.talk .cv-b.go { border-color: rgba(57,255,138,.6); }
/* each place speaks in its own voice: type, colours and edge of the plate follow the place and its host */
.cv-card.talk { --pb: rgba(232,206,150,.55); --pbtn: rgba(232,206,150,.28); --tf: var(--display); --bf: var(--display); }
.cv-card.talk h3, .cv-card.talk .cv-who b { font-family: var(--tf); letter-spacing: var(--tls, 0); }
.cv-card.talk h3 { font-size: var(--tsz, 20px); font-weight: var(--tw, 700); }
.cv-card.talk .cv-line { font-family: var(--bf); font-size: var(--bsz, 15px); }
.cv-card.talk { border-color: var(--pb); outline-color: var(--pb); }
.cv-card.talk .cv-b { border-color: var(--pbtn); }
.cv-card.talk[data-place=radio], .cv-card.talk[data-place=bar], .cv-card.talk[data-place=canoe], .cv-card.talk[data-place=pier] { --tf: "Lilita One", var(--display); --tw: 400; --tsz: 24px; --tls: .02em; border: 3px solid var(--pb); outline: 2px dashed rgba(255,255,255,.12); outline-offset: -8px; border-radius: 16px; background: linear-gradient(180deg, rgba(40,24,12,.55), rgba(20,12,6,.75)), repeating-linear-gradient(0deg, #5a3a22 0 26px, #4a2f1b 26px 28px); }
.cv-card.talk[data-place=radio] { --pb: #f2b33d; --pbtn: rgba(242,179,61,.45); }
.cv-card.talk[data-place=bar] { --pb: #3fc1b0; --pbtn: rgba(63,193,176,.45); }
.cv-card.talk[data-place=canoe] { --pb: #e2674f; --pbtn: rgba(226,103,79,.45); }
.cv-card.talk[data-place=pier] { --pb: #8fd3f0; --pbtn: rgba(143,211,240,.45); background: linear-gradient(180deg, rgba(12,30,44,.6), rgba(6,16,26,.8)), repeating-linear-gradient(90deg, #4f5b5e 0 40px, #434d50 40px 42px); }
.cv-card.talk[data-place=north] { --tf: "Cinzel", serif; --tw: 600; --tsz: 22px; --tls: .08em; --pb: #c9d6e2; --pbtn: rgba(201,214,226,.35); border: 1px solid var(--pb); outline: 1px solid rgba(201,214,226,.35); outline-offset: 5px; border-radius: 2px; background: linear-gradient(160deg, rgba(44,60,78,.96), rgba(16,24,34,.96)); }
.cv-card.talk[data-place=south] { --tf: "Fraunces", serif; --tw: 600; --tsz: 24px; --pb: #f0b48a; --pbtn: rgba(240,180,138,.4); border: 2px solid var(--pb); outline: none; border-radius: 22px; background: linear-gradient(160deg, rgba(118,52,30,.95), rgba(58,24,14,.95)); }
.cv-card.talk[data-place=market] { --tf: "Fraunces", serif; --tw: 600; --tsz: 24px; --pb: #fbf3df; --pbtn: rgba(251,243,223,.35); border-width: 1px; border-style: solid; outline: none; border-radius: 10px; padding-top: 26px; background: repeating-linear-gradient(90deg, #e2674f 0 28px, #fbf3df 28px 56px) top / 100% 12px no-repeat, rgba(30,20,13,.95); }
.cv-card.talk[data-place=hall] { --tf: "Fraunces", serif; --tw: 600; --tsz: 24px; --pb: #d8452f; --pbtn: rgba(216,69,47,.45); border: 2px solid var(--pb); outline: 1px solid rgba(134,184,90,.4); outline-offset: 4px; border-radius: 12px; background: linear-gradient(170deg, rgba(48,30,18,.96), rgba(22,30,18,.96)); }
.cv-card.talk[data-place=book], .cv-card.talk[data-place=ship], .cv-card.talk[data-place=ama], .cv-card.talk[data-place=stone], .cv-card.talk[data-place=drums], .cv-card.talk[data-place=circle], .cv-card.talk[data-place=grotto] { --tf: "IM Fell English", Georgia, serif; --tw: 400; --tsz: 25px; --bf: "IM Fell English", Georgia, serif; --bsz: 17px; --pb: #c9a86a; --pbtn: rgba(201,168,106,.4); border: 2px solid var(--pb); outline: 1px solid rgba(201,168,106,.3); outline-offset: 4px; border-radius: 4px; background: radial-gradient(ellipse at 50% 0%, rgba(201,168,106,.12), transparent 70%), rgba(34,26,16,.95); }
.cv-card.talk[data-place=ship] { --pb: #d9b45a; background: radial-gradient(ellipse at 50% 0%, rgba(217,180,90,.1), transparent 70%), rgba(14,26,40,.95); }
.cv-card.talk[data-place=grotto] { --pb: #6fd6c8; --pbtn: rgba(111,214,200,.35); background: radial-gradient(ellipse at 50% 100%, rgba(111,214,200,.14), transparent 70%), rgba(6,24,28,.95); }
.cv-card.talk[data-place=school], .cv-card.talk[data-place=camp] { --tf: "Patrick Hand", cursive; --tw: 400; --tsz: 26px; --bf: "Patrick Hand", cursive; --bsz: 19px; --pb: #8b5e34; --pbtn: rgba(244,240,226,.35); border: 9px solid var(--pb); outline: none; border-radius: 6px; background: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.05), transparent 60%), #1f3a2c; }
.cv-card.talk[data-place=camp] { --pb: #7a6a44; background: repeating-linear-gradient(45deg, rgba(255,255,255,.03) 0 3px, transparent 3px 6px), #3a3322; }
.cv-card.talk[data-place=works] { --tf: "Alfa Slab One", serif; --tw: 400; --tsz: 23px; --tls: .02em; --pb: #c8742d; --pbtn: rgba(200,116,45,.45); border: 3px solid var(--pb); outline: none; border-radius: 4px; background: radial-gradient(circle at 10px 10px, #c8742d 2px, transparent 3px) 0 0 / calc(100% - 14px) calc(100% - 14px) no-repeat, radial-gradient(circle at calc(100% - 10px) 10px, #c8742d 2px, transparent 3px), linear-gradient(170deg, rgba(52,44,40,.97), rgba(26,22,20,.97)); }
.cv-card.talk[data-place=dive] { --tf: "Sora", var(--display); --tw: 700; --tls: .04em; --pb: #39d0c0; --pbtn: rgba(57,208,192,.4); border: 1px solid var(--pb); outline: 1px solid rgba(57,208,192,.25); outline-offset: 4px; border-radius: 14px; background: linear-gradient(170deg, rgba(4,44,52,.95), rgba(2,20,26,.95)); }
.cv-card.intro, .cv-card.paper, .cv-card.end { left: 50%; right: auto; transform: translateX(-50%); width: min(760px, calc(100% - 32px)); animation: popc .35s cubic-bezier(.2,.8,.2,1); }
.cv-card.intro, .cv-card.end, .cv-card.paper { top: 50%; bottom: auto; transform: translate(-50%, -50%); max-height: calc(100% - 112px); }
.cv-card.paper { width: min(560px, calc(100% - 32px)); animation: none; }
.stage.pre .bar .chip:not(button) { visibility: hidden; }
@keyframes pop { from { opacity: 0; transform: translateY(10px); } }
@keyframes popc { from { opacity: 0; } }
.cv-x { position: absolute; right: 10px; top: 10px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--hair); background: none; color: var(--text); cursor: pointer; font-size: 14px; }
.cv-x:hover { border-color: #fff; }
.cv-card.intro .cv-x, .cv-card.paper .cv-x, .cv-card.locked .cv-x { display: none; }
.cv-who { display: flex; gap: 12px; align-items: center; padding-right: 40px; }
.cv-who .face { flex: none; border-radius: 12px; background: radial-gradient(circle at 50% 35%, rgba(255,214,160,.18), rgba(255,255,255,.03)); border: 1px solid var(--line); }
.cv-who b { display: block; font: 700 17px var(--display); color: #fff; }
.cv-who small { color: var(--dim); }
.cv-card h2 { margin: 0; font: 700 clamp(26px, 3vw, 40px)/1.1 var(--display); color: #fff; }
.cv-card h3 { margin: 0; font: 700 18px var(--display); color: #fff; }
.cv-card h4 { margin: 0 0 6px; font: 600 11px var(--display); letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
.kick { margin: 0; font: 600 11px var(--display); letter-spacing: .22em; text-transform: uppercase; color: var(--ok); }
.cv-line { margin: 0; font: 400 15px/1.55 var(--display); color: var(--text); }
.cv-note { margin: 0; color: var(--dim); }
.cv-h { margin: 4px 0 0; font: 600 11px var(--display); letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
.cv-acts { display: flex; flex-direction: column; gap: 6px; }
.cv-b { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-height: 44px; padding: 8px 12px; text-align: left; border-radius: 9px; border: 1px solid var(--hair); background: rgba(255,255,255,.03); color: #fff; font: 600 13.5px var(--display); cursor: pointer; }
.cv-b small { font: 400 11.5px var(--mono); color: var(--dim); }
.cv-b:hover:not([disabled]), .cv-b:focus-visible { border-color: #fff; background: rgba(255,255,255,.07); outline: none; }
.cv-b.go { border-color: rgba(57,255,138,.6); }
.cv-b.go:hover:not([disabled]) { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok) inset; }
.cv-b.warn small { color: var(--amber); }
.cv-b[disabled] { opacity: .45; cursor: default; }
.cv-laws ul, .cv-folk, .cv-book, .cv-help, .cv-lesson ul, .cv-paper ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.cv-laws li small, .dim { color: var(--dim); }
.cv-folk li { display: grid; grid-template-columns: 74px minmax(0, 1fr) 90px; gap: 8px; align-items: center; }
.cv-folk .nm { font: 600 13px var(--display); color: #fff; }
.cv-folk small { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cv-folk .bar { position: relative; height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); }
.cv-folk .bar::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--v); border-radius: 3px; background: #fff; }
.cv-folk .bar.lead::after { background: var(--ok); }
.cv-book li { display: grid; gap: 1px; padding: 6px 8px; border-left: 2px solid var(--hair); background: rgba(255,255,255,.02); }
.cv-book li small { color: var(--dim); font-size: 11px; }
.cv-book b { color: #fff; }
.cv-book .k-lie, .cv-book .k-broke { border-left-color: var(--amber); }
.cv-book .k-law { border-left-color: var(--ok); }
.cv-help li, .cv-lesson li { padding-left: 16px; position: relative; color: var(--text); }
.cv-help li::before, .cv-lesson li::before { content: "·"; position: absolute; left: 4px; color: var(--ok); font-weight: 700; }
.cv-lesson { border: 1px solid rgba(57,255,138,.35); border-radius: 10px; padding: 12px 14px; }
.cv-votes { display: flex; gap: 14px; justify-content: center; padding: 6px 0; }

.cv-votes .face { border-radius: 50%; border: 2px solid var(--hair); }

.cv-votes .no .face { border-color: var(--bad); }
.cv-votes figcaption { font: 600 12px var(--display); }

.cv-votes .no .th { color: var(--bad); }
.cv-tape { margin: 0; min-height: 22px; text-align: center; font: 600 14px var(--display); color: #fff; }
.cv-result { margin: 0; font: 700 18px var(--display); }
.cv-result.ok { color: var(--ok); }
.cv-result.bad { color: var(--bad); }
.cv-pick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.cv-cand { display: grid; justify-items: center; gap: 4px; padding: 12px 8px; border-radius: 12px; border: 1px solid var(--hair); background: rgba(255,255,255,.03); color: var(--text); cursor: pointer; text-align: center; font: 12px var(--mono); }
.cv-cand:hover, .cv-cand:focus-visible { border-color: var(--ok); background: rgba(57,255,138,.06); outline: none; }
.cv-cand .face { border-radius: 50%; background: radial-gradient(circle at 50% 35%, rgba(255,214,160,.2), rgba(255,255,255,.03)); }
.cv-cand b { font: 700 15px var(--display); color: #fff; }
.cv-cand small { color: var(--dim); line-height: 1.35; }
.cv-cand em { font-style: normal; color: var(--text); font-size: 11.5px; line-height: 1.4; }
.cv-ballot { margin: 0; color: var(--dim); font-size: 12px; }
.cv-ballot b { color: var(--text); font-weight: 600; }
.cv-chain { display: flex; gap: 10px; align-items: flex-start; color: var(--dim); cursor: pointer; }
.cv-chain input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--ok); flex: none; }
/* the morning paper */
.cv-paper { background: #f3ead6; color: #1c1a16; border-radius: 6px; padding: 18px 20px; font: 15px/1.5 Georgia, "Times New Roman", serif; box-shadow: 0 1px 0 rgba(0,0,0,.2); }
.cv-paper .mast { margin: 0; text-align: center; font: 700 28px/1 Georgia, serif; letter-spacing: .04em; border-bottom: 3px double #1c1a16; padding-bottom: 8px; }

.cv-paper .joke { margin: 10px 0 0; font-style: italic; color: #4a4236; }
.cv-card.paper { gap: 12px; background: rgba(10,14,18,.6); }

.cv-drawer { position: fixed; z-index: 60; right: 16px; top: 16px; bottom: 16px; width: min(520px, calc(100% - 32px)); display: flex; flex-direction: column; background: #0c0c0e; border: 1px solid rgba(57,255,138,.55); border-radius: 12px; overflow: hidden; box-shadow: 0 30px 80px -20px rgba(0,0,0,.9); }
.cv-drawer .dh { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.cv-drawer .dh b { font: 600 14px var(--display); color: #fff; }
.cv-drawer .dh button { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--hair); background: none; color: var(--text); cursor: pointer; }
.cv-drawer iframe { flex: 1; border: 0; width: 100%; background: transparent; }
