affected%20block.%0A%0A%2A%2A2.%20Peers%20advertise%20%60%2Fip4%2F0.0.0.0%2Ftcp%2F4001%60%20as%20their%20own%20address.%2A%2A%20%60_self_advertised_addrs%28%29%60%20falls%20back%20to%20%60host.get_addrs%28%29%60%2C%20which%20for%20a%20node%20bound%20to%20%600.0.0.0%60%20is%20the%20bind%20address.%20A%20peer%20stores%20that%20in%20its%20peerstore%20%28and%20persists%20it%20in%20the%20%60peers%60%20table%29.%20libp2p%200.8%20dials%20only%20one%20TCP%20address%20per%20peer%2C%20so%20after%20a%20restart%20our%20node%20dialed%20%600.0.0.0%3A4001%60%2C%20i.e.%20its%20own%20listener%2C%20and%20every%20bootstrap%20dial%20failed%20with%20%60failed%20to%20upgrade%20security%20for%20peer%2012D3KooWDpWE%E2%80%A6%3A%20handshake%20failed%20when%20upgrading%20to%20secure%20connection%60%20%28its%20own%20peer%20id%20on%20the%20other%20end%29.%20Suggestion%3A%20drop%20unspecified%2Floopback%2Fprivate%20addresses%20when%20learning%20peer%20addresses%2C%20and%20dial%20configured%20bootstrap%20peers%20at%20their%20configured%20addresses%20only.%20Setting%20%60TAU_ANNOUNCE_ADDRS%60%20on%20the%20bootnode%20would%20also%20fix%20the%20advertised%20side.%0A%0A%2A%2A3.%20Chain%20restarts%20on%20the%20same%20genesis.%2A%2A%20The%20network%20was%20restarted%20again%20around%2013%3A30%20UTC%20today%2C%20keeping%20the%20genesis.%20A%20node%20that%20had%20stored%20blocks%20of%20the%20previous%20run%20sees%20the%20bootnode%27s%20head%20below%20its%20own%20height%20%28%60Peer%20%E2%80%A6%20head%20%2378%20%E2%80%A6%2C%20local%20head%20%239%3A%20nothing%20to%20sync%60%29%20and%20never%20recovers.%20Is%20there%20a%20channel%20where%20restarts%20are%20announced%3F%20And%20would%20you%20consider%20changing%20the%20genesis%20timestamp%20%28or%20%60TAU_NETWORK_ID%60%29%20on%20each%20restart%2C%20so%20that%20the%20existing%20genesis%20gate%20rejects%20the%20old%20data%20instead%20of%20leaving%20nodes%20silently%20stuck%3F%0A%0AHappy%20to%20open%20separate%20issues%20for%202%20and%203%20if%20you%20prefer.">
