<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>No Memo · sounds</title>
<style>
  :root { --bg: #050806; --fg: #cfe9d6; --dim: #6f8a77; --acc: #b9ffd6; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 ui-monospace, Menlo, Consolas, monospace; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 18px; color: var(--acc); margin: 0 0 4px; } p { color: var(--dim); margin: 0 0 16px; }
  h2 { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin: 22px 0 6px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid #13201a; }
  button { width: 44px; height: 44px; background: transparent; color: var(--acc); border: 1px solid #2c4636; border-radius: 4px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--acc); }
  b { color: var(--fg); font-weight: 600; } small { color: var(--dim); font-size: 12px; display: block; }
  a { color: var(--acc); }
</style>
</head>
<body>
<main>
  <h1>No Memo · the ship's sounds</h1>
  <p>Every sound the terminal plays, at the loudness it plays it. <a href="../">Back to the terminal</a></p>
  <div id="list"></div>
</main>
<script>
(async () => {
  const j = await (await fetch("list.json")).json(), box = document.getElementById("list");
  let ctx = null, cur = null;
  const KIND = { ambience: "Ambience", ui: "Terminal", event: "Events" };
  for (const kind of Object.keys(KIND)) {
    const h = document.createElement("h2"); h.textContent = KIND[kind]; box.append(h);
    const ul = document.createElement("ul"); box.append(ul);
    for (const s of j.sounds.filter(x => x.kind === kind)) {
      const li = document.createElement("li"), b = document.createElement("button"), d = document.createElement("div");
      b.textContent = "▶"; b.title = "play " + s.name; b.setAttribute("aria-label", "play " + s.name);
      d.innerHTML = "<b></b><small></small>"; d.querySelector("b").textContent = s.name + " · " + s.what; d.querySelector("small").textContent = s.when + " · " + s.sec + " s";
      b.onclick = async () => {
        ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === "suspended") ctx.resume();
        if (cur) { try { cur.stop(); } catch (e) {} cur = null; }
        const buf = await new Promise((ok, no) => fetch(s.name + ".mp3").then(r => r.arrayBuffer()).then(a => { const p = ctx.decodeAudioData(a, ok, no); if (p && p.then) p.then(ok, no); }));
        const src = ctx.createBufferSource(), g = ctx.createGain(); src.buffer = buf; g.gain.value = s.gain * 0.85; src.connect(g).connect(ctx.destination); src.start(); cur = src;
      };
      li.append(b, d); ul.append(li);
    }
  }
})();
</script>
</body>
</html>
